# .github/workflows/ci-node.yml
#
# Pipeline CI para proyecto Node.js con:
#   - Tests con Jest
#   - Artifact de build
#   - Notificación con secret + environment gate
#
# Secrets necesarios (configurar en Settings → Secrets):
#   - SLACK_WEBHOOK_URL: URL del webhook de Slack (simulado en el lab)
#
# Variables necesarias (configurar en Settings → Variables):
#   - APP_ENV: nombre del entorno (ej: "staging")
#
# Environment necesario (configurar en Settings → Environments):
#   - staging: con Required Reviewers habilitado

name: CI — Node.js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # ← permite dispararlo manualmente desde la UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────
  # JOB 1: test
  # Ejecuta la suite de Jest y sube el reporte de cobertura.
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test con Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"     # ← cachea node_modules para acelerar

      - name: Instalar dependencias
        run: npm ci         # ← más estricto que npm install (usa package-lock.json)

      - name: Ejecutar tests con cobertura
        run: npm run test:coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # JOB 2: build
  # Simula un paso de build (en un proyecto real: webpack, tsc, etc.)
  # Genera un artifact que el job "notify" podría desplegar.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test    # ← solo buildea si los tests pasaron

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Crear artifact de build
        run: |
          mkdir -p dist
          cp -r src/ dist/
          echo "{ \"version\": \"${{ github.sha }}\", \"build\": \"$(date -u +%Y%m%d%H%M%S)\" }" > dist/build-info.json
          echo "✅ Artifact generado:"
          cat dist/build-info.json

      - name: Subir artifact de build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # JOB 3: notify
  # Simula una notificación de deployment usando un secret.
  # Tiene un gate de aprobación manual gracias a "environment: staging".
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notificar deployment
    runs-on: ubuntu-latest
    needs: build
    environment: staging    # ← gate: requiere aprobación manual

    steps:
      - name: Mostrar información del deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Deployment aprobado"
          echo "  Entorno  : ${{ vars.APP_ENV }}"
          echo "  Rama     : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Simular notificación con webhook
        # En producción usarías: curl -X POST $WEBHOOK_URL -d '{"text": "..."}'
        # Nunca hagas echo del secret directamente
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "✅ Secret SLACK_WEBHOOK_URL configurado correctamente"
            echo "📢 Enviando notificación a Slack (simulado)..."
            # curl -s -X POST "$WEBHOOK_URL" \
            #   -H "Content-Type: application/json" \
            #   -d "{\"text\": \"Deployment exitoso a ${{ vars.APP_ENV }} — commit ${{ github.sha }}\"}"
          else
            echo "⚠️ Secret SLACK_WEBHOOK_URL no configurado"
          fi
